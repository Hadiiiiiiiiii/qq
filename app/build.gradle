plugins {
    id 'com.android.application'
}

android {
    namespace 'com.graphstudio.calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.graphstudio.calculator'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    // A fixed debug key kept in the repo: every GitHub build is signed with the same key,
    // so a new APK installs over the old one (no uninstall needed after the first time).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
